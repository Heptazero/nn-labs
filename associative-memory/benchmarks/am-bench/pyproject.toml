[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-bench"
version = "0.1.0"
description = "Shared associative-memory benchmark components"
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "pandas", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
